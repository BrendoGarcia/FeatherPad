name: Build Windows
on:
  pull_request:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'tools/**', 'CMakeLists.txt', 'build.cmd', 'LEIA-ME.md', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile native launcher
        run: cmake --build build --config Release
      - name: Verify migration, artwork, focus and controller translation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Include instructions
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FeatherPad-Windows-x64
          path: |
            build/Release/FeatherPad.exe
            build/Release/Updater.exe
            build/Release/LICENSE
            build/Release/SDL3.dll
            build/Release/licenses/
            build/Release/LEIA-ME.md
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeatherPad-test-report
          path: |
            build/keyboard-preview.bmp
            build/*-115.bmp
            build/self-test.log
            build/Testing/Temporary/LastTest.log
