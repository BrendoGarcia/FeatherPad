name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, for example v2.2.0 (must match CMake version)'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package and verify tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(FeatherPad VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match the CMake stable version' }
          $header = Get-Content src/update_common.h -Raw
          if (-not $header.Contains("version=`"$version`"")) { throw 'Updater version does not match CMake' }
          Copy-Item LEIA-ME.md,LICENSE build/Release/
          New-Item release-assets -ItemType Directory -Force | Out-Null
          Copy-Item build/Release/FeatherPad.exe,build/Release/Updater.exe,build/Release/SDL3.dll,LEIA-ME.md,LICENSE release-assets/
          Copy-Item build/Release/licenses/SDL3.txt,build/Release/licenses/ViGEmClient.txt release-assets/
          Compress-Archive -Path build/Release/FeatherPad.exe,build/Release/Updater.exe,build/Release/SDL3.dll,build/Release/licenses,build/Release/LEIA-ME.md,build/Release/LICENSE -DestinationPath "release-assets/FeatherPad-Windows-x64-$version.zip"
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8
      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title "FeatherPad $env:RELEASE_TAG" --generate-notes release-assets/*
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten automatically' }
